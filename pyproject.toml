[project]
name = "prospeccion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andres", email = "andremartinx56@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.3",
    "lxml>=5.3.0",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpay>=0.0.8",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymongo>=4.18.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
prospeccion = "prospeccion:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
